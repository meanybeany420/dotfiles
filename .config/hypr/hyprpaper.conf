# Place your own wallpaper at this path before starting hyprpaper.
# Blank monitor applies the cover image to any output (no machine connector names).
# For a local per-output image, add a wallpaper block with your connector name,
# path = ~/.local/share/backgrounds/external.png and fit_mode = contain.
# Keep those hardware/asset choices local; no wallpapers are bundled.
wallpaper {
    monitor =
    path = ~/.local/share/backgrounds/wallpaper.png
    fit_mode = cover
}
splash = false
