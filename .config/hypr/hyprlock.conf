# Two-second grace is passed by hypridle as hyprlock --grace 2.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(0,0,0)
    contrast = 0.8916
    brightness = 0.2172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(255,255,255)
    inner_color = rgb(15, 15, 15)
    font_color = rgb(255,255,255)
    fade_on_empty = false
    placeholder_text = <i> </i>
    position = 0, -40
    halign = center
    valign = center
}

