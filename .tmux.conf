unbind C-b
set -g prefix C-h
bind C-h send-prefix
set -sg escape-time 0
run '~/.tmux/plugins/tpm/tpm'
bind a select-window -t 0
bind s select-window -t 1
bind d select-window -t 2
bind f select-window -t 3

# Minimal top status bar
set -g status-position top
set -g status on
set -g status-interval 1

# Center window names
set -g status-justify centre
set -g status-left-length 0
set -g status-right-length 0

# Background: #050505 in nvim, terminal default otherwise
set -g status-style "fg=#5d3036,bg=#{?#{==:#{pane_current_command},nvim},#050505,default}"

set -g status-left ""
set -g status-right ""

# No index, no position, no *
set -g window-status-format " #W "
set -g window-status-current-format " #W "

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

